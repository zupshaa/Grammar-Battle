<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f7f4fb; --ink:#3b3550; --sub:#6d6785; --card:#ffffff; --shadow:rgba(80,60,120,.16);
  --c1:#cfe3f7; --c2:#e0d6f5; --c3:#fbefb9; --c4:#d3e8d0; --c5:#fbd9c4; --c6:#f8d3e2; --c7:#cdeae6;
  --tileink:#3b3550;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
}
:root[data-theme="dark"]{--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:22px 16px 6px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.4rem);margin:0;letter-spacing:.5px;line-height:1.1}
h1 span{display:inline-block;padding:0 .25em;border-radius:.4em;margin:0 .1em}
h1 .a{background:var(--c2)} h1 .b{background:var(--c3)}
h1 span{color:#3b3550}
header p{margin:6px 0 0;color:var(--sub);font-weight:700}
.scroller{overflow-x:auto;padding:14px 14px 28px}
.board{display:flex;gap:10px;max-width:1560px;margin:0 auto;min-width:min-content}
.col{flex:1 1 0;min-width:118px;display:flex;flex-direction:column;gap:12px}
.cat{height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:16px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(.95rem,1.45vw,1.3rem);line-height:1.1;color:var(--tileink);box-shadow:0 4px 0 var(--shadow)}
.tile{appearance:none;border:0;cursor:pointer;height:clamp(64px,11vh,104px);border-radius:14px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2.3rem);color:var(--tileink);box-shadow:0 4px 0 var(--shadow);transition:transform .18s ease,box-shadow .18s ease,opacity .3s ease,filter .3s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 0 var(--shadow);outline:none}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile:active{transform:translateY(1px);box-shadow:0 2px 0 var(--shadow)}
.tile.used{opacity:.35;filter:saturate(.6)}
.tile.used:hover{opacity:.6}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}.k5{background:var(--c5)}.k6{background:var(--c6)}.k7{background:var(--c7)}
.overlay{position:fixed;inset:0;background:rgba(40,32,64,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex;animation:fade .2s ease}
.modal{position:relative;background:var(--card);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .22s ease}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 64px 16px 22px;color:var(--tileink)}
.mhead b{font-family:"Baloo 2",sans-serif;font-size:1.5rem}
.pts{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;background:rgba(255,255,255,.65);border-radius:999px;padding:0 16px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:#3b3550;font-size:1.6rem;line-height:1;cursor:pointer;transition:transform .15s}
.x:hover{transform:rotate(90deg)}
.mbody{padding:26px 28px 30px}
.q{font-size:clamp(1.3rem,2.8vw,2rem);font-weight:700;line-height:1.45;max-width:70ch}
.ans{margin-top:22px;padding:18px 22px;border-radius:16px;background:var(--page);border-left:8px solid var(--c4);font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;line-height:1.45;display:none}
.ans.show{display:block;animation:pop .2s ease}
.show-btn{margin-top:24px;appearance:none;border:0;cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;padding:10px 28px;border-radius:999px;background:var(--c4);color:#3b3550;box-shadow:0 4px 0 var(--shadow);transition:transform .15s}
.show-btn:hover{transform:translateY(-2px)}
u{text-decoration-thickness:3px;text-underline-offset:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="a">Grammar</span><span class="b">Battle</span></h1>
  <p>Pick any category and any points.</p>
</header>
<div class="scroller"><main class="board" id="board"></main></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mcat">
    <div class="mhead" id="mhead"><b id="mcat"></b><span class="pts" id="mpts"></span></div>
    <button class="x" id="close" aria-label="Close">×</button>
    <div class="mbody">
      <div class="q" id="mq"></div>
      <button class="show-btn" id="show">Show Answer</button>
      <div class="ans" id="ma"></div>
    </div>
  </div>
</div>

<script>
/* ===== QUESTION BANK — edit here. Use \n for line breaks and **text** for underlined words. ===== */
const POINTS = [5, 10, 20, 50, 100];
const CATEGORIES = [
  { name: "Descriptive Text", items: [
    { q: "Which tense is mostly used in a descriptive text?", a: "Simple Present." },
    { q: "Which sentence is the IDENTIFICATION part of a descriptive text?\n\nA. She has long black hair and brown eyes.\nB. I want to tell you about my best friend, Nadia.\nC. Nadia is always kind to everyone.\nD. Everyone loves her smile.", a: "B. I want to tell you about my best friend, Nadia." },
    { q: "Read the text:\n\n“Mount Bromo is one of the most famous volcanoes in East Java. Its crater is wide and often covered with thick white smoke. At sunrise, the sky turns orange and pink, and the sand sea below looks like a golden carpet.”\n\nWhat is being described, and which phrase compares it to something else to make the description more vivid?", a: "Mount Bromo (a volcano in East Java).\n\nThe comparison: “looks like a golden carpet.”" },
    { q: "Rewrite each sentence to make it more descriptive. Add at least TWO adjectives or details to each.\n\n1. I have a bag.\n2. The beach is nice.", a: "Answers vary. Examples:\n1. I have a small blue backpack with two zippers and a cat keychain.\n2. The beach is clean and quiet, with soft white sand and clear blue water." },
    { q: "Find and correct ALL mistakes:\n\n“My grandmother house are very old but beautiful. It have a big garden with colorful flower. The walls is painted white, and there is many old photos on it.”", a: "“My grandmother’s house is very old but beautiful. It has a big garden with colorful flowers. The walls are painted white, and there are many old photos on them.”" }
  ]},
  { name: "Report Text", items: [
    { q: "Which part of a report text tells what the subject is and which group it belongs to?", a: "General Classification.\n\nExample: “Tigers are large wild cats.”" },
    { q: "Which sentence is the best GENERAL CLASSIFICATION of a report text?\n\nA. My pet hamster is called Coco.\nB. Bats are flying mammals that are active at night.\nC. Last week, I saw a bat in my yard.\nD. Bats are scary, so I don’t like them.", a: "B. Bats are flying mammals that are active at night." },
    { q: "Read the text:\n\n“Our dog, Rocky, is a golden retriever. He is two years old and has soft golden fur. He loves chasing balls in the yard.”\n\nThis is NOT a report text. Explain why.", a: "It describes ONE specific dog (Rocky), not golden retrievers or dogs in general. So it is a descriptive text." },
    { q: "Read the text:\n\n“Komodo dragons are the largest lizards in the world. They live on a few islands in Indonesia, including Komodo and Rinca. An adult Komodo dragon can grow up to three meters long. They hunt deer, pigs, and sometimes bigger animals.”\n\nAnswer these questions:\n1. Which sentence is the General Classification?\n2. Where do they live?\n3. How long can an adult Komodo dragon grow?", a: "1. “Komodo dragons are the largest lizards in the world.”\n2. On a few islands in Indonesia, including Komodo and Rinca.\n3. Up to three meters long." },
    { q: "Write a short report text (4–5 sentences) about ONE of these topics: cats, bananas, or the moon.\n\nInclude a General Classification and at least THREE general facts in Simple Present. Do not write personal opinions.", a: "Answers vary. Example:\n“Cats are small mammals that are kept as pets. They have sharp claws and excellent night vision. Most cats sleep 12 to 16 hours a day. They eat meat and communicate by meowing and purring.”" }
  ]},
  { name: "Recount Text", items: [
    { q: "Name TWO time connectives that are used in a recount text to show the order of events.", a: "Any two, for example: first, then, next, after that, before, afterwards, finally." },
    { q: "Which sentence is a REORIENTATION of a recount text?\n\nA. Last holiday, I went to Bali with my family.\nB. We visited a temple and a beach.\nC. It was an unforgettable trip, and I want to go back.\nD. We left at 6 a.m.", a: "C. It was an unforgettable trip, and I want to go back." },
    { q: "Read the text:\n\n“Last Sunday, my class went to the zoo. First, we saw the elephants. After that, we watched the monkeys. Finally, we ate lunch under a tree.”\n\nFind all the time connectives.", a: "First, After that, Finally." },
    { q: "Read the text:\n\n“Last Friday, Dina went to a bookstore with her sister. They arrived at noon, but the bookstore was closed because of a power outage. So, they waited in a café nearby for an hour. Then the lights came on, and they finally bought two novels. Dina was tired but happy.”\n\nAnswer these questions:\n1. Why was the bookstore closed?\n2. What did they do while waiting?\n3. How did Dina feel at the end?", a: "1. Because of a power outage.\n2. They waited in a café nearby.\n3. She felt tired but happy." },
    { q: "Arrange these sentences into a correct recount text, then label the Orientation, Events, and Reorientation.\n\nA. We were exhausted, but it was the best weekend ever.\nB. Last weekend, my friends and I went camping at Mount Penanggungan.\nC. After that, we set up our tents and cooked dinner.\nD. First, we hiked for three hours to reach the campsite.\nE. At night, we sang songs around the campfire.", a: "B – D – C – E – A\n\n• Orientation: B\n• Events: D, C, E\n• Reorientation: A" }
  ]},
  { name: "Biography", items: [
    { q: "Is a biography written in the first person (I) or the third person (he/she)? Why?", a: "Third person (he/she), because it tells the life story of another person." },
    { q: "What is the difference between a biography and an autobiography?", a: "A biography is written by someone else about a person’s life. An autobiography is written by the person about his or her own life." },
    { q: "Read the text:\n\n“Ki Hajar Dewantara was born on May 2, 1889, in Yogyakarta. He was a pioneer of education in Indonesia and founded the Taman Siswa school in 1922. His birthday is celebrated as National Education Day.”\n\nWhich sentence is the Orientation, and what was one of his achievements?", a: "Orientation: “Ki Hajar Dewantara was born on May 2, 1889, in Yogyakarta.”\n\nAchievement: He founded the Taman Siswa school in 1922 (or: he was a pioneer of education in Indonesia)." },
    { q: "Read the text:\n\n“B.J. Habibie was born on June 25, 1936, in Parepare, South Sulawesi. He studied aeronautical engineering in Germany and worked there as an aircraft engineer. In 1998, he became the third President of Indonesia. He passed away on September 11, 2019.”\n\nAnswer these questions:\n1. Where did he study, and what field?\n2. What position did he hold in 1998?\n3. Which sentence tells about the end of his life?", a: "1. In Germany; aeronautical engineering.\n2. Third President of Indonesia.\n3. “He passed away on September 11, 2019.”" },
    { q: "Write a short biography (4–5 sentences) of R.A. Kartini using these notes:\n\n• Born April 21, 1879, in Jepara\n• Daughter of a regent\n• Wrote letters to Dutch friends about women’s education\n• Opened a school for girls in Jepara\n• Died September 17, 1904\n• Her letters were published as a book in 1911", a: "Answers vary. Example:\n“R.A. Kartini was born on April 21, 1879, in Jepara. She was the daughter of a regent. She wrote letters to her Dutch friends about women’s right to education. She also opened a school for girls in Jepara. She died on September 17, 1904, and her letters were published as a book in 1911.”\n\nCheck: Simple Past, correct order of events, third person." }
  ]},
  { name: "Simple Present", items: [
    { q: "Complete the sentence by choosing the correct answer:\n\n“She _____ to school every day.”\n\nA. go\nB. goes\nC. going\nD. gone", a: "B. goes." },
    { q: "Complete the sentence:\n\n“My father _____ (work) in a hospital.”", a: "Works." },
    { q: "Change the sentence into negative:\n\n“They play football every Sunday.”", a: "They don’t play football every Sunday." },
    { q: "Find and correct ALL mistakes:\n\n“My sister don’t likes coffee. She drink tea every morning.”", a: "“My sister doesn’t like coffee. She drinks tea every morning.”" },
    { q: "Make TWO different WH-questions based on this sentence:\n\n“Sarah studies English at the library every afternoon.”", a: "1. What does Sarah study at the library every afternoon?\n2. Where does Sarah study English every afternoon?" }
  ]},
  { name: "Simple Past", items: [
    { q: "What is the past form of EAT?", a: "Ate." },
    { q: "Complete the sentence:\n\n“We _____ (visit) our grandparents yesterday.”", a: "Visited." },
    { q: "Change the sentence into negative:\n\n“She watched television last night.”", a: "She didn’t watch television last night." },
    { q: "Find and correct ALL mistakes:\n\n“Yesterday, I goed to the supermarket and buy some apples.”", a: "“Yesterday, I went to the supermarket and bought some apples.”" },
    { q: "Read the paragraph and change ALL verbs into Simple Past:\n\n“Every morning, Daniel wakes up at 6 a.m. He takes a shower, eats breakfast, and goes to school. Yesterday, he _____ up late, _____ a quick shower, _____ breakfast, and _____ to school by car.”", a: "Woke – took – ate – went." }
  ]},
  { name: "Past Continuous", items: [
    { q: "What is the correct formula of Past Continuous Tense?", a: "Subject + was/were + verb-ing." },
    { q: "Complete the sentence:\n\n“She _____ (sleep) at 10 p.m. last night.”", a: "Was sleeping." },
    { q: "Choose the correct sentence:\n\nA. They was playing football.\nB. They were playing football.\nC. They are playing football.\nD. They were play football.", a: "B. They were playing football." },
    { q: "Combine these sentences using Past Continuous and Simple Past:\n\n“I was taking a shower. The phone rang.”", a: "I was taking a shower when the phone rang." },
    { q: "Find and correct ALL mistakes:\n\n“While I were studying, my brother was play games. Suddenly, the lights was going out.”", a: "“While I was studying, my brother was playing games. Suddenly, the lights went out.”" }
  ]}
];
/* ===== END QUESTION BANK ===== */

const used = new Set();
let current = null;
const $ = id => document.getElementById(id);
const fmt = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/\*\*(.+?)\*\*/g,"<u><b>$1</b></u>").replace(/\n/g,"<br>");

const board = $("board");
CATEGORIES.forEach((cat, ci) => {
  const col = document.createElement("div"); col.className = "col";
  col.innerHTML = `<div class="cat k${ci+1}">${cat.name}</div>`;
  POINTS.forEach((p, pi) => {
    const b = document.createElement("button");
    b.className = `tile k${ci+1}`; b.textContent = "$" + p;
    b.id = `t-${ci}-${pi}`;
    b.setAttribute("aria-label", `${cat.name} for $${p}`);
    b.onclick = () => openQ(ci, pi);
    col.appendChild(b);
  });
  board.appendChild(col);
});

function openQ(ci, pi) {
  current = [ci, pi];
  const cat = CATEGORIES[ci];
  $("mhead").className = `mhead k${ci+1}`;
  $("mcat").textContent = cat.name;
  $("mpts").textContent = "$" + POINTS[pi];
  $("mq").innerHTML = fmt(cat.items[pi].q);
  $("ma").innerHTML = fmt(cat.items[pi].a);
  $("ma").classList.remove("show");
  $("show").style.display = "";
  $("overlay").classList.add("open");
  $("show").focus();
}
function closeQ() {
  if (!current) return;
  used.add(`t-${current[0]}-${current[1]}`);
  $(`t-${current[0]}-${current[1]}`).classList.add("used");
  $("overlay").classList.remove("open");
  current = null;
}
$("show").onclick = () => { $("ma").classList.add("show"); $("show").style.display = "none"; };
$("close").onclick = closeQ;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeQ(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeQ(); });
</script>
</body>
</html>
