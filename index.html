<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f7f4fb; --ink:#3b3550; --sub:#6d6785; --card:#ffffff; --shadow:rgba(80,60,120,.16);
  --c1:#cfe3f7; --c2:#e0d6f5; --c3:#fbefb9; --c4:#d3e8d0; --c5:#fbd9c4; --c6:#f8d3e2;
  --tileink:#3b3550;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
}
:root[data-theme="dark"]{--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:22px 16px 6px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.4rem);margin:0;letter-spacing:.5px;line-height:1.1}
h1 span{display:inline-block;padding:0 .25em;border-radius:.4em;margin:0 .1em}
h1 .a{background:var(--c2)} h1 .b{background:var(--c3)}
h1 span{color:#3b3550}
header p{margin:6px 0 0;color:var(--sub);font-weight:700}
.scroller{overflow-x:auto;padding:14px 14px 28px}
.board{display:flex;gap:12px;max-width:1400px;margin:0 auto;min-width:min-content}
.col{flex:1 1 0;min-width:128px;display:flex;flex-direction:column;gap:12px}
.cat{height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:16px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1rem,1.7vw,1.4rem);line-height:1.1;color:var(--tileink);box-shadow:0 4px 0 var(--shadow)}
.tile{appearance:none;border:0;cursor:pointer;height:clamp(64px,11vh,104px);border-radius:14px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.5rem,3vw,2.5rem);color:var(--tileink);box-shadow:0 4px 0 var(--shadow);transition:transform .18s ease,box-shadow .18s ease,opacity .3s ease,filter .3s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 0 var(--shadow);outline:none}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile:active{transform:translateY(1px);box-shadow:0 2px 0 var(--shadow)}
.tile.used{opacity:.35;filter:saturate(.6)}
.tile.used:hover{opacity:.6}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}.k5{background:var(--c5)}.k6{background:var(--c6)}
.overlay{position:fixed;inset:0;background:rgba(40,32,64,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex;animation:fade .2s ease}
.modal{position:relative;background:var(--card);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .22s ease}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 64px 16px 22px;color:var(--tileink)}
.mhead b{font-family:"Baloo 2",sans-serif;font-size:1.5rem}
.pts{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;background:rgba(255,255,255,.65);border-radius:999px;padding:0 16px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:#3b3550;font-size:1.6rem;line-height:1;cursor:pointer;transition:transform .15s}
.x:hover{transform:rotate(90deg)}
.mbody{padding:26px 28px 30px}
.q{font-size:clamp(1.3rem,2.8vw,2rem);font-weight:700;line-height:1.45;max-width:70ch}
.ans{margin-top:22px;padding:18px 22px;border-radius:16px;background:var(--page);border-left:8px solid var(--c4);font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;line-height:1.45;display:none}
.ans.show{display:block;animation:pop .2s ease}
.show-btn{margin-top:24px;appearance:none;border:0;cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;padding:10px 28px;border-radius:999px;background:var(--c4);color:#3b3550;box-shadow:0 4px 0 var(--shadow);transition:transform .15s}
.show-btn:hover{transform:translateY(-2px)}
u{text-decoration-thickness:3px;text-underline-offset:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="a">Grammar</span><span class="b">Battle</span></h1>
  <p>Pick any category and any points.</p>
</header>
<div class="scroller"><main class="board" id="board"></main></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mcat">
    <div class="mhead" id="mhead"><b id="mcat"></b><span class="pts" id="mpts"></span></div>
    <button class="x" id="close" aria-label="Close">×</button>
    <div class="mbody">
      <div class="q" id="mq"></div>
      <button class="show-btn" id="show">Show Answer</button>
      <div class="ans" id="ma"></div>
    </div>
  </div>
</div>

<script>
/* ===== QUESTION BANK — edit here. Use \n for line breaks and **text** for underlined words. ===== */
const POINTS = [5, 10, 20, 50, 100];
const CATEGORIES = [
  { name: "Simple Past", items: [
    { q: "What is the past form of GO?", a: "Went." },
    { q: "Complete the sentence:\n\n“She _____ (buy) a new dress yesterday.”", a: "Bought." },
    { q: "Change the sentence into negative:\n\n“They watched a movie last night.”", a: "They didn’t watch a movie last night." },
    { q: "Find and correct all mistakes:\n\n“Yesterday, my brother go to the market and buyed some fruits.”", a: "“Yesterday, my brother went to the market and bought some fruits.”" },
    { q: "Rewrite the paragraph using Simple Past:\n\n“Last Sunday, I wake up late. I eat breakfast, take a shower, and go to the mall. I meet my friends and we watch a movie.”", a: "“Last Sunday, I woke up late. I ate breakfast, took a shower, and went to the mall. I met my friends and we watched a movie.”" }
  ]},
  { name: "WH-Questions", items: [
    { q: "Which WH-question word do we use to ask about a person’s identity?", a: "Who." },
    { q: "Complete the question:\n\n“_____ did you go yesterday?”\n“I went to the library.”", a: "Where." },
    { q: "Make a question for the underlined information:\n\n“Rina bought **a new bicycle** yesterday.”", a: "What did Rina buy yesterday?" },
    { q: "Arrange the words into a correct question:\n\n“you / why / late / arrive / did / yesterday”", a: "Why did you arrive late yesterday?" },
    { q: "Read the sentence below and make THREE different WH-questions.\n\n“David visited his grandmother in Jakarta last weekend because she was sick.”", a: "Possible answers:\n1. Who did David visit?\n2. Where did David visit his grandmother?\n3. Why did David visit his grandmother?" }
  ]},
  { name: "Zero Conditional", items: [
    { q: "Complete the sentence by choosing the correct answer:\n\n“If you don’t water plants, they _____.”\n\nA. die\nB. died\nC. will die\nD. dying", a: "A. die." },
    { q: "Complete the sentence:\n\n“If water reaches 100°C, it _____ (boil).”", a: "boils." },
    { q: "Complete the sentence using the correct verb forms:\n\n“If people _____ (not/eat), they _____ (get) hungry.”", a: "don’t eat – get." },
    { q: "Find and correct the mistakes:\n\n“If plants doesn’t get water, they dies.”", a: "“If plants don’t get water, they die.”" },
    { q: "Find and correct ALL mistakes in these sentences:\n\n1. If water freeze, it becomes ice.\n2. Plants dies if they don’t get enough sunlight.\n3. If you mixes red and blue, you gets purple.", a: "1. If water freezes, it becomes ice.\n2. Plants die if they don’t get enough sunlight.\n3. If you mix red and blue, you get purple." }
  ]},
  { name: "Question Tags", items: [
    { q: "Complete the question tag:\n\n“You are a student, _____?”", a: "Aren’t you?" },
    { q: "Complete the question tag:\n\n“She likes chocolate, _____?”", a: "Doesn’t she?" },
    { q: "Complete the question tag:\n\n“They didn’t go to school yesterday, _____?”", a: "Did they?" },
    { q: "Find and correct the mistakes in these question tags:\n\n1. He can swim, doesn’t he?\n2. You aren’t tired, aren’t you?", a: "1. He can swim, can’t he?\n2. You aren’t tired, are you?" },
    { q: "Complete both question tags:\n\n1. “The students have finished their homework, _____?”\n2. “Your brother didn’t call you, _____?”", a: "1. Haven’t they?\n2. Did he?" }
  ]},
  { name: "Present Perfect", items: [
    { q: "Choose the correct auxiliary verb:\n\n“She _____ finished her homework.”\n\nA. Have\nB. Has", a: "B. Has." },
    { q: "Complete the sentence:\n\n“I have _____ (finish) my homework.”", a: "Finished." },
    { q: "Change the sentence into negative:\n\n“He has visited Bali.”", a: "He hasn’t visited Bali." },
    { q: "Find and correct all mistakes:\n\n“She have never ate sushi, but she has tryed pizza.”", a: "“She has never eaten sushi, but she has tried pizza.”" },
    { q: "Explain the difference between these two sentences:\n\n1. I visited Bali last year.\n2. I have visited Bali.\n\nWhy can’t we use “last year” in the second sentence?", a: "• The first sentence uses Simple Past because it describes a completed action at a specific time in the past.\n• The second sentence uses Present Perfect to describe an experience without specifying when it happened.\n• “Last year” refers to a finished time in the past, so it is not used with Present Perfect." }
  ]},
  { name: "Comparison", items: [
    { q: "What is the comparative form of TALL?", a: "Taller." },
    { q: "Complete the sentence:\n\n“An elephant is _____ (big) than a goat.”", a: "Bigger." },
    { q: "Complete the sentence:\n\n“Mount Everest is _____ (high) mountain in the world.”", a: "The highest." },
    { q: "Find and correct all mistakes:\n\n“My phone is more cheaper than yours, but your camera is the bestest.”", a: "“My phone is cheaper than yours, but your camera is the best.”" },
    { q: "Complete the paragraph using the correct forms of the adjectives:\n\n“Tom is _____ (young) than Jack, but Jack is _____ (tall) than Tom. Among their three friends, Tom is the _____ (friendly). Jack is good at math, but Tom is even _____ (good) at it.”", a: "Younger – taller – friendliest – better." }
  ]}
];
/* ===== END QUESTION BANK ===== */

const used = new Set();
let current = null;
const $ = id => document.getElementById(id);
const fmt = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/\*\*(.+?)\*\*/g,"<u><b>$1</b></u>").replace(/\n/g,"<br>");

const board = $("board");
CATEGORIES.forEach((cat, ci) => {
  const col = document.createElement("div"); col.className = "col";
  col.innerHTML = `<div class="cat k${ci+1}">${cat.name}</div>`;
  POINTS.forEach((p, pi) => {
    const b = document.createElement("button");
    b.className = `tile k${ci+1}`; b.textContent = "$" + p;
    b.id = `t-${ci}-${pi}`;
    b.setAttribute("aria-label", `${cat.name} for $${p}`);
    b.onclick = () => openQ(ci, pi);
    col.appendChild(b);
  });
  board.appendChild(col);
});

function openQ(ci, pi) {
  current = [ci, pi];
  const cat = CATEGORIES[ci];
  $("mhead").className = `mhead k${ci+1}`;
  $("mcat").textContent = cat.name;
  $("mpts").textContent = "$" + POINTS[pi];
  $("mq").innerHTML = fmt(cat.items[pi].q);
  $("ma").innerHTML = fmt(cat.items[pi].a);
  $("ma").classList.remove("show");
  $("show").style.display = "";
  $("overlay").classList.add("open");
  $("show").focus();
}
function closeQ() {
  if (!current) return;
  used.add(`t-${current[0]}-${current[1]}`);
  $(`t-${current[0]}-${current[1]}`).classList.add("used");
  $("overlay").classList.remove("open");
  current = null;
}
$("show").onclick = () => { $("ma").classList.add("show"); $("show").style.display = "none"; };
$("close").onclick = closeQ;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeQ(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeQ(); });
</script>
</body>
</html>
