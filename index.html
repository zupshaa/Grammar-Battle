<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f7f4fb; --ink:#3b3550; --sub:#6d6785; --card:#ffffff; --shadow:rgba(80,60,120,.16);
  --c1:#cfe3f7; --c2:#e0d6f5; --c3:#fbefb9; --c4:#d3e8d0; --c5:#fbd9c4; --c6:#f8d3e2; --c7:#cdeae6;
  --tileink:#3b3550;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
}
:root[data-theme="dark"]{--page:#272338;--ink:#f1edfb;--sub:#b9b3d0;--card:#352f4b;--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:22px 16px 6px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.4rem);margin:0;letter-spacing:.5px;line-height:1.1}
h1 span{display:inline-block;padding:0 .25em;border-radius:.4em;margin:0 .1em}
h1 .a{background:var(--c2)} h1 .b{background:var(--c3)}
h1 span{color:#3b3550}
header p{margin:6px 0 0;color:var(--sub);font-weight:700}
.scroller{overflow-x:auto;padding:14px 14px 28px}
.board{display:flex;gap:10px;max-width:1560px;margin:0 auto;min-width:min-content}
.col{flex:1 1 0;min-width:118px;display:flex;flex-direction:column;gap:12px}
.cat{height:84px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:16px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(.95rem,1.45vw,1.3rem);line-height:1.1;color:var(--tileink);box-shadow:0 4px 0 var(--shadow)}
.tile{appearance:none;border:0;cursor:pointer;height:clamp(64px,11vh,104px);border-radius:14px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.4rem,2.6vw,2.3rem);color:var(--tileink);box-shadow:0 4px 0 var(--shadow);transition:transform .18s ease,box-shadow .18s ease,opacity .3s ease,filter .3s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 0 var(--shadow);outline:none}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tile:active{transform:translateY(1px);box-shadow:0 2px 0 var(--shadow)}
.tile.used{opacity:.35;filter:saturate(.6)}
.tile.used:hover{opacity:.6}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}.k5{background:var(--c5)}.k6{background:var(--c6)}.k7{background:var(--c7)}
.overlay{position:fixed;inset:0;background:rgba(40,32,64,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex;animation:fade .2s ease}
.modal{position:relative;background:var(--card);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .22s ease}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 64px 16px 22px;color:var(--tileink)}
.mhead b{font-family:"Baloo 2",sans-serif;font-size:1.5rem}
.pts{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;background:rgba(255,255,255,.65);border-radius:999px;padding:0 16px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:#3b3550;font-size:1.6rem;line-height:1;cursor:pointer;transition:transform .15s}
.x:hover{transform:rotate(90deg)}
.mbody{padding:26px 28px 30px}
.q{font-size:clamp(1.3rem,2.8vw,2rem);font-weight:700;line-height:1.45;max-width:70ch}
.ans{margin-top:22px;padding:18px 22px;border-radius:16px;background:var(--page);border-left:8px solid var(--c4);font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:800;line-height:1.45;display:none}
.ans.show{display:block;animation:pop .2s ease}
.show-btn{margin-top:24px;appearance:none;border:0;cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.3rem;padding:10px 28px;border-radius:999px;background:var(--c4);color:#3b3550;box-shadow:0 4px 0 var(--shadow);transition:transform .15s}
.show-btn:hover{transform:translateY(-2px)}
u{text-decoration-thickness:3px;text-underline-offset:4px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="a">Grammar</span><span class="b">Battle</span></h1>
  <p>Pick any category and any points.</p>
</header>
<div class="scroller"><main class="board" id="board"></main></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mcat">
    <div class="mhead" id="mhead"><b id="mcat"></b><span class="pts" id="mpts"></span></div>
    <button class="x" id="close" aria-label="Close">×</button>
    <div class="mbody">
      <div class="q" id="mq"></div>
      <button class="show-btn" id="show">Show Answer</button>
      <div class="ans" id="ma"></div>
    </div>
  </div>
</div>

<script>
/* ===== QUESTION BANK — edit here. Use \n for line breaks and **text** for underlined words. ===== */
const POINTS = [5, 10, 20, 50, 100];
const CATEGORIES = [
  { name: "Descriptive Text", items: [
    { q: "What is the main purpose of a descriptive text?", a: "To describe a particular person, place, animal, or thing." },
    { q: "What are the two main parts of a descriptive text?", a: "Identification and Description." },
    { q: "Read the text:\n\n“My cat is named Milo. He has white fur, blue eyes, and a long tail. He is very playful and loves sleeping on my bed.”\n\nWhat animal is being described?", a: "A cat." },
    { q: "Read the text:\n\n“The library in my school is quite large. It has five bookshelves, three reading tables, and a comfortable sofa. The walls are painted light blue, making the room feel peaceful. Students often visit the library during breaks.”\n\nMention THREE details about the library.", a: "• It has five bookshelves.\n• It has three reading tables.\n• It has a comfortable sofa.\n• Its walls are painted light blue.\n\nAny three correct details are acceptable." },
    { q: "Describe your favorite place in 3–4 sentences. Include at least TWO adjectives and TWO details about the place.", a: "Answers may vary. The description should include relevant details and adjectives." }
  ]},
  { name: "Report Text", items: [
    { q: "What is the main purpose of a report text?", a: "To present factual information about something in general." },
    { q: "What are the two main parts of a report text?", a: "General Classification and Description." },
    { q: "Read the text:\n\n“Dolphins are marine mammals. They live in oceans and are known for their intelligence. They communicate using sounds and body movements.”\n\nIs this a descriptive text or a report text?", a: "Report text." },
    { q: "Read the text:\n\n“Penguins are birds that cannot fly. They live mostly in the Southern Hemisphere, especially in Antarctica. Penguins have wings that help them swim. They eat fish, squid, and other small sea animals.”\n\nAnswer these questions:\n1. Where do penguins mostly live?\n2. What do they use their wings for?\n3. What do penguins eat?", a: "1. In the Southern Hemisphere, especially in Antarctica.\n2. To swim.\n3. Fish, squid, and other small sea animals." },
    { q: "Explain TWO differences between a report text and a descriptive text.", a: "• Report text describes something in general, while descriptive text describes a particular person, place, animal, or thing.\n• Report text usually presents general facts, while descriptive text focuses on specific characteristics." }
  ]},
  { name: "Recount Text", items: [
    { q: "What is the main purpose of a recount text?", a: "To retell past events or experiences." },
    { q: "What are the three main parts of a recount text?", a: "Orientation, Events, and Reorientation." },
    { q: "Which part of a recount text introduces the people, place, and time of an event?", a: "Orientation." },
    { q: "Read the text:\n\n“Last Saturday, my family and I went to the beach. We arrived at 8 a.m. First, we played in the sand. Then, we swam in the sea and ate lunch together. Before going home, we took some pictures. It was a wonderful day.”\n\nAnswer these questions:\n1. When did the writer go to the beach?\n2. Who went to the beach?\n3. What did they do before going home?", a: "1. Last Saturday.\n2. The writer and their family.\n3. They took some pictures." },
    { q: "Arrange these events in the correct order based on the recount text:\n\nA. We ate lunch together.\nB. We arrived at the beach.\nC. We took some pictures.\nD. We played in the sand.", a: "B – D – A – C." }
  ]},
  { name: "Biography", items: [
    { q: "What is a biography?", a: "A text that tells the life story of another person." },
    { q: "What information is usually included in the orientation of a biography?", a: "The person’s background, such as their name, birthplace, and birth date." },
    { q: "Read the text:\n\n“R.A. Kartini was born on April 21, 1879, in Jepara, Indonesia. She was known for her efforts to improve education for women.”\n\nWhere was R.A. Kartini born?", a: "Jepara, Indonesia." },
    { q: "Read the text:\n\n“Thomas Edison was an American inventor. He was born in 1847 in Ohio. He developed many inventions, including improvements to the electric light bulb. His work helped change modern life.”\n\nAnswer these questions:\n1. What was Thomas Edison’s nationality?\n2. When was he born?\n3. What invention is mentioned in the text?", a: "1. American.\n2. In 1847.\n3. Improvements to the electric light bulb." },
    { q: "Mention THREE important pieces of information that are usually included in a biography.", a: "Any three of the following:\n• Date and place of birth.\n• Family or educational background.\n• Important life events.\n• Achievements or contributions.\n• Challenges or struggles.\n• Date and place of death (if applicable)." }
  ]},
  { name: "Simple Present", items: [
    { q: "Complete the sentence by choosing the correct answer:\n\n“She _____ to school every day.”\n\nA. go\nB. goes\nC. going\nD. gone", a: "B. goes." },
    { q: "Complete the sentence:\n\n“My father _____ (work) in a hospital.”", a: "Works." },
    { q: "Change the sentence into negative:\n\n“They play football every Sunday.”", a: "They don’t play football every Sunday." },
    { q: "Find and correct ALL mistakes:\n\n“My sister don’t likes coffee. She drink tea every morning.”", a: "“My sister doesn’t like coffee. She drinks tea every morning.”" },
    { q: "Make TWO different WH-questions based on this sentence:\n\n“Sarah studies English at the library every afternoon.”", a: "1. What does Sarah study at the library every afternoon?\n2. Where does Sarah study English every afternoon?" }
  ]},
  { name: "Simple Past", items: [
    { q: "What is the past form of EAT?", a: "Ate." },
    { q: "Complete the sentence:\n\n“We _____ (visit) our grandparents yesterday.”", a: "Visited." },
    { q: "Change the sentence into negative:\n\n“She watched television last night.”", a: "She didn’t watch television last night." },
    { q: "Find and correct ALL mistakes:\n\n“Yesterday, I goed to the supermarket and buy some apples.”", a: "“Yesterday, I went to the supermarket and bought some apples.”" },
    { q: "Read the paragraph and change ALL verbs into Simple Past:\n\n“Every morning, Daniel wakes up at 6 a.m. He takes a shower, eats breakfast, and goes to school. Yesterday, he _____ up late, _____ a quick shower, _____ breakfast, and _____ to school by car.”", a: "Woke – took – ate – went." }
  ]},
  { name: "Past Continuous", items: [
    { q: "What is the correct formula of Past Continuous Tense?", a: "Subject + was/were + verb-ing." },
    { q: "Complete the sentence:\n\n“She _____ (sleep) at 10 p.m. last night.”", a: "Was sleeping." },
    { q: "Choose the correct sentence:\n\nA. They was playing football.\nB. They were playing football.\nC. They are playing football.\nD. They were play football.", a: "B. They were playing football." },
    { q: "Combine these sentences using Past Continuous and Simple Past:\n\n“I was taking a shower. The phone rang.”", a: "I was taking a shower when the phone rang." },
    { q: "Find and correct ALL mistakes:\n\n“While I were studying, my brother was play games. Suddenly, the lights was going out.”", a: "“While I was studying, my brother was playing games. Suddenly, the lights went out.”" }
  ]}
];
/* ===== END QUESTION BANK ===== */

const used = new Set();
let current = null;
const $ = id => document.getElementById(id);
const fmt = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/\*\*(.+?)\*\*/g,"<u><b>$1</b></u>").replace(/\n/g,"<br>");

const board = $("board");
CATEGORIES.forEach((cat, ci) => {
  const col = document.createElement("div"); col.className = "col";
  col.innerHTML = `<div class="cat k${ci+1}">${cat.name}</div>`;
  POINTS.forEach((p, pi) => {
    const b = document.createElement("button");
    b.className = `tile k${ci+1}`; b.textContent = "$" + p;
    b.id = `t-${ci}-${pi}`;
    b.setAttribute("aria-label", `${cat.name} for $${p}`);
    b.onclick = () => openQ(ci, pi);
    col.appendChild(b);
  });
  board.appendChild(col);
});

function openQ(ci, pi) {
  current = [ci, pi];
  const cat = CATEGORIES[ci];
  $("mhead").className = `mhead k${ci+1}`;
  $("mcat").textContent = cat.name;
  $("mpts").textContent = "$" + POINTS[pi];
  $("mq").innerHTML = fmt(cat.items[pi].q);
  $("ma").innerHTML = fmt(cat.items[pi].a);
  $("ma").classList.remove("show");
  $("show").style.display = "";
  $("overlay").classList.add("open");
  $("show").focus();
}
function closeQ() {
  if (!current) return;
  used.add(`t-${current[0]}-${current[1]}`);
  $(`t-${current[0]}-${current[1]}`).classList.add("used");
  $("overlay").classList.remove("open");
  current = null;
}
$("show").onclick = () => { $("ma").classList.add("show"); $("show").style.display = "none"; };
$("close").onclick = closeQ;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeQ(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeQ(); });
</script>
</body>
</html>
